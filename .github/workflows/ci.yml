name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:relay
      - run: npm test
      - run: npm run test:relay
      - run: npm run build
      - name: Wrangler dry run (open-source config)
        run: npx wrangler deploy --dry-run
      - name: Wrangler dry run (production config)
        run: npx wrangler deploy --dry-run --config packages/relay/wrangler.jsonc
